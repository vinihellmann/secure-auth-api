openapi: 3.1.0
info:
  title: Secure Auth API
  version: 1.0.0
  description: |
    Authentication service with RS256/ES256 access tokens (JWKS with rotation, JOSE `typ`
    `at+jwt`), opaque rotating refresh tokens with reuse detection, TOTP two-factor
    authentication, envelope-encrypted secrets, sliding-window rate limiting and an
    HMAC-chained audit log.

    Errors use `application/problem+json` (RFC 9457) with a stable `code` field.
  license:
    name: MIT
servers:
  - url: http://localhost:3001
tags:
  - name: Auth
  - name: Account
  - name: Sessions
  - name: MFA
  - name: Admin
  - name: Discovery

paths:
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: Rate limited to 5 per hour per IP. Passwords are hashed with scrypt (N=2^15, r=8, p=3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Password step of the login
      description: |
        Returns tokens, or `mfaRequired: true` with a 5 minute `mfaToken` when 2FA is enabled.
        Failures are indistinguishable for unknown and known emails. Repeated failures lock
        the account temporarily with exponential backoff (429 `too_many_failed_attempts`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Tokens or MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - $ref: '#/components/schemas/MfaChallenge'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: Second step with a TOTP code or a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken]
              properties:
                mfaToken: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                recoveryCode: { type: string, examples: [ABCDE-FGHJK] }
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: |
        Every call returns a new refresh token and invalidates the old one. Presenting an
        already rotated token revokes the whole session (reuse detection).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security: [{ Bearer: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      tags: [Account]
      summary: Current user
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      mfaEnabled: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/me/password:
    post:
      tags: [Account]
      summary: Change password (revokes every other session)
      security: [{ Bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }

  /v1/sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke a session (its access tokens stop working immediately)
      security: [{ Bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Start TOTP enrollment (requires the current password)
      security: [{ Bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Provisioning data (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri: { type: string }
                  qrCodeDataUrl: { type: string, description: PNG data URL }
                  secret: { type: string, description: Base32 secret for manual entry }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/mfa/totp/enable:
    post:
      tags: [MFA]
      summary: Confirm enrollment with a code; returns 10 single-use recovery codes
      security: [{ Bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/mfa/totp/disable:
    post:
      tags: [MFA]
      summary: Disable 2FA (password plus TOTP or recovery code)
      security: [{ Bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                code: { type: string }
                recoveryCode: { type: string }
      responses:
        '204': { description: Disabled }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/audit-events:
    get:
      tags: [Admin]
      summary: List audit events (newest first, cursor pagination)
      security: [{ Bearer: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: eventType, in: query, schema: { type: string } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/admin/audit-events/verify:
    get:
      tags: [Admin]
      summary: Verify the HMAC chain end to end
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  checked: { type: integer }
                  headHash: { type: string }
                  legacyRows:
                    type: integer
                    description: Unkeyed SHA-256 rows accepted below the signed cut-over anchor
                  anchor:
                    type: string
                    enum: [absent, valid, invalid]
                    description: Cut-over anchor state; an invalid anchor fails verification
                  firstBroken:
                    type: object
                    properties:
                      id: { type: string }
                      reason:
                        type: string
                        enum:
                          [
                            prev_hash_mismatch,
                            hash_mismatch,
                            unkeyed_after_cutover,
                            unknown_mac_key,
                          ]

  /v1/admin/users/{id}/lock:
    post:
      tags: [Admin]
      summary: Lock a user and revoke all their sessions
      security: [{ Bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Locked }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/admin/users/{id}/unlock:
    post:
      tags: [Admin]
      summary: Unlock a user
      security: [{ Bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Unlocked }

  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      summary: Public signing keys (all loaded kids)
      responses:
        '200':
          description: JWK Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty: { type: string, enum: [RSA, EC] }
                        kid: { type: string }
                        use: { type: string, const: sig }
                        alg: { type: string, enum: [RS256, ES256] }
                        n: { type: string, description: RSA only }
                        e: { type: string, description: RSA only }
                        crv: { type: string, const: P-256, description: EC only }
                        x: { type: string, description: EC only }
                        y: { type: string, description: EC only }

  /health:
    get:
      tags: [Discovery]
      summary: Liveness
      responses:
        '200': { description: Up }
  /ready:
    get:
      tags: [Discovery]
      summary: Readiness (Postgres, Redis)
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited or account temporarily locked
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
        RateLimit-Policy: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          description: 12 to 128 chars, upper, lower, digit and symbol.

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        roles: { type: array, items: { type: string, enum: [user, admin] } }
        createdAt: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        mfaRequired: { type: boolean, const: false }
        tokenType: { type: string, const: Bearer }
        accessToken: { type: string, description: 'JWT (typ at+jwt, RS256 or ES256), 15 minutes' }
        expiresIn: { type: integer }
        refreshToken: { type: string, description: Opaque, single use }
        refreshTokenExpiresAt: { type: string, format: date-time }

    MfaChallenge:
      type: object
      properties:
        mfaRequired: { type: boolean, const: true }
        mfaToken: { type: string }
        mfaTokenExpiresIn: { type: integer }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        userAgent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [string, 'null'] }
        eventType: { type: string }
        ip: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        metadata: { type: object }
        prevHash: { type: string }
        hash: { type: string }

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors: {}
